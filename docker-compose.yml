services:
  whale-bot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - DB_PATH=/app/data/whale_bot.db
    networks:
      - botnet

networks:
  botnet:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1400"
